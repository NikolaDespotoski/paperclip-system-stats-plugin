name: Release

# Runs on every merge to main: builds, tests, bumps the version, publishes to
# npm and cuts a GitHub release + tag.
#
# The next version is derived from the highest existing `vX.Y.Z` tag (falling
# back to the version in package.json the first time), so every merge produces a
# distinct release even though the bumped package.json is not committed back.
# Add #minor or #major to the merge commit message to override the default patch
# bump. Tag pushes do not re-trigger this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Secrets cannot be referenced directly in `if:` conditions, so expose it as
    # an env var and gate the publish step on that instead.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the next version is derived from existing tags.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Determine next version
        id: version
        run: |
          MSG="${{ github.event.head_commit.message }}"
          BUMP=patch
          if grep -qi '#major' <<<"$MSG"; then
            BUMP=major
          elif grep -qi '#minor' <<<"$MSG"; then
            BUMP=minor
          fi

          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
          BASE=${LATEST_TAG:-$(node -p "require('./package.json').version")}
          npm version "$BASE" --no-git-tag-version --allow-same-version >/dev/null
          NEXT=$(npm version "$BUMP" --no-git-tag-version)
          echo "bump=$BUMP" >>"$GITHUB_OUTPUT"
          echo "version=${NEXT#v}" >>"$GITHUB_OUTPUT"
          echo "Bumped $BASE -> ${NEXT#v} ($BUMP)"

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: npm publish --access public

      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --generate-notes --title "v$VERSION" \
            || echo "release v$VERSION already exists"
